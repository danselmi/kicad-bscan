# OpenOCD configuration for the demo board simulator (demo/demo_sim.py).
#
#   python3 demo/demo_sim.py &
#   openocd -f demo/openocd-demo.cfg
#
# Tcl RPC port: 6666 (OpenOCD default)

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 5555
transport select jtag
adapter speed 1000

# Declared in chain order starting at TDO: TDI -> U1 (MCU) -> U2 (FPGA) -> TDO
jtag newtap fpga tap -irlen 6 -expected-id 0x03a420ef
jtag newtap mcu  tap -irlen 4 -expected-id 0x1d3c10ef

# No targets: boundary-scan only
init
