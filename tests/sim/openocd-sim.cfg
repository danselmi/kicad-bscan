# OpenOCD configuration for the JTAG simulator (tests/sim/jtag_sim.py).
#
#   python3 tests/sim/jtag_sim.py &
#   openocd -f tests/sim/openocd-sim.cfg
#
# Tcl RPC port: 6666 (OpenOCD default)

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 5555
transport select jtag
adapter speed 1000

# Declared in chain order starting at TDO
jtag newtap simchip tap -irlen 4 -expected-id 0x1b5c30ef
jtag newtap other   tap -irlen 5 -expected-id 0x4ba00477

# No targets: boundary-scan only
init
